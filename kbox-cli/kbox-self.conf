# KBox self-obfuscation: high-strength self-protection.
# Renames + string encryption + anti-analysis suite.
# Control flow obfuscation is disabled (too slow on 196 classes).
# Class encryption is disabled (would break classpath-based runtime injection).
# String scattering is disabled (breaks internal string operations in the protector).
# Exception jump obf is disabled (VerifyError with new+invokespec+athrow patterns).

renameIdentifiers = true
encryptStrings = true
scatterStrings = false
obfuscateControlFlow = false
stringEncryptionStrength = 1

# Anti-analysis: light anti-decompiler + anti-debug + integrity + watermark.
# Exception jump obfuscation is disabled for self-protection (interacts badly
# with the protector's complex new+invokespec+athrow patterns).
antiDecompilerLevel = 1
antiDebug = true
integrityCheck = true
exceptionJumpObf = false
watermark = KBOX-SELF-PROTECT-2026-FULL

# Keep the CLI entry point + ASM library + KBox runtime classes intact.
# The runtime classes must keep their original names so the protector can
# inject them into targets it protects.
keepPrefix = com.kbox.cli.ProtectorCli, org.objectweb.asm., com.kbox.runtime.
entryPoint = com.kbox.cli.ProtectorCli

cc = C:/msys64/mingw64/bin/gcc.exe
