# KBox protection config for the testapp — Anti-Dump + Scatter enabled.
# Tests methods 32 (anti-dump) and 33 (scatter strings) at full strength.
renameIdentifiers = true
encryptStrings = true
obfuscateControlFlow = true
controlFlowStrength = 2
stringEncryptionStrength = 1

# Resource obfuscation: rename + encrypt.
obfuscateResources = true
fixKotlinMetadata = true
encryptResource = config/*.properties
excludeResource = assets/banner.txt, META-INF/*.SF, META-INF/*.RSA, META-INF/*.DSA

# Anti-Dump: encrypt class bodies with AES-GCM. Eligible: all app classes.
encryptClasses = true

# Scatter strings across holder classes instead of inline byte[] literals.
scatterStrings = true

# Anti-analysis: full strength.
antiDecompilerLevel = 3
antiDebug = true
integrityCheck = true
watermark = KBOX-FULLDUMP-2026
exceptionJumpObf = true

# Keep the public entry-point class so its main(String[]) stays callable.
keepPrefix = com.kbox.testapp.Main
keepMember = com.kbox.testapp.Greeter#greet(Ljava/lang/String;)Ljava/lang/String;

# CC path on this Windows machine.
cc = C:/msys64/mingw64/bin/gcc.exe
