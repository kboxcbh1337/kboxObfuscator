# KBox protection config for testapp — MAXIMUM STRENGTH with VMP.
# Goal: java -jar runs normally + no plaintext decryption logic in jar +
#       anti-decompiler measures crash Recaf/JD-GUI/Deobfuscator.

# === Identifier obfuscation ===
renameIdentifiers = true

# === String encryption (AES, strength 3) ===
encryptStrings = true
stringEncryptionStrength = 3
scatterStrings = false

# === Control flow obfuscation ===
obfuscateControlFlow = true
controlFlowStrength = 2

# === Anti-Dump: class body encryption (DISABLED — would break classpath loading
#     before ResourceGuardLauncher runs on this small test app) ===
encryptClasses = false

# === VMP (Virtual Machine Protection) — translate decryption method bodies
#     to custom opcodes so no plaintext decryptor is in the jar ===
enableVmp = true
vmpProtectRuntime = false

# === JNIC (Java to Native) — disabled for this verification run
#     (requires gcc + JNI symbol setup; VMP already covers the no-plaintext goal) ===
enableJnic = false

# === Resource obfuscation ===
obfuscateResources = true
fixKotlinMetadata = true
encryptResource = config/*.properties, *.properties, *.xml, *.json, *.yml, *.yaml
excludeResource = assets/banner.txt, META-INF/*.SF, META-INF/*.RSA, META-INF/*.DSA

# === Anti-decompiler level 3 (max: goto-chain + exception bomb + InnerClasses cycle + cp-bomb) ===
antiDecompilerLevel = 3

# === Anti-debug ===
antiDebug = true

# === VMP interpreter self-check ===
vmpSelfCheck = true

# === Custom watermark ===
watermark = kboxstudio

# === Jar integrity check / anti-repackaging ===
integrityCheck = true

# === Exception-jump obfuscation (DISABLED for VMP debugging) ===
exceptionJumpObf = false

# === Native anti-hook ===
nativeAntiHook = true

# === Keep the public entry-point class ===
keepPrefix = com.kbox.testapp.Main
keepMember = com.kbox.testapp.Greeter#greet(Ljava/lang/String;)Ljava/lang/String;

# === C compiler path (for JNIC, if enabled) ===
cc = C:/msys64/mingw64/bin/gcc.exe
