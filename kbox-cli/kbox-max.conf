# KBox self-obfuscation: MAXIMUM STRENGTH — all features maxed out.
# All obfuscation/anti-analysis techniques enabled at their highest level.
# Watermark: kboxstudio

# === Identifier obfuscation ===
renameIdentifiers = true

# === String encryption (max strength) ===
encryptStrings = true
stringEncryptionStrength = 3
# Scattered string encryption DISABLED for self-obfuscation:
# scatterStrings breaks internal string operations of the protector itself
# (it rewrites string-getfield patterns that the runtime uses internally).
scatterStrings = false

# === Control flow obfuscation ===
# DISABLED for self-obfuscation: opaque predicates create dead-code branches
# whose jump targets have no reachable frame. ASM's COMPUTE_FRAMES then throws
# NullPointerException: dstFrame is null during packaging, and the COMPUTE_MAXS
# fallback would leave stale frames -> VerifyError at runtime. The transform is
# fully effective (and enabled by default) on third-party apps; it only breaks
# when self-hosted because the protector's own ASM-heavy classes produce
# pathological CFGs after predicate injection. All OTHER max-strength features
# (string encryption 3, anti-decompiler 3, watermark, resource obf, anti-debug,
# integrity check, native anti-hook) remain at maximum.
obfuscateControlFlow = false
controlFlowStrength = 3

# === Anti-Dump: encrypt class bodies with AES-GCM ===
# DISABLED for self-obfuscation: encryptClasses rewrites the class bytes of every
# class to a custom cipher format (magic != 0xCAFEBABE). The ResourceGuardLauncher
# decrypts them at runtime, but the protector's own classes must remain loadable
# from the classpath by the JVM bootstrap BEFORE ResourceGuardLauncher runs
# (e.g. com.kbox.core.log.KBoxLog, used by the launcher itself). Encrypting them
# produces ClassFormatError: Incompatible magic value 1262633797.
encryptClasses = false

# === VMP (Virtual Machine Protection) ===
enableVmp = false

# === JNIC (Java to Native) — disabled (requires native compiler + matching JNI symbols) ===
enableJnic = false

# === Resource obfuscation ===
obfuscateResources = true
fixKotlinMetadata = true
encryptResource = config/*.properties, *.properties, *.xml, *.json, *.yml, *.yaml
excludeResource = META-INF/*.SF, META-INF/*.RSA, META-INF/*.DSA

# === Anti-decompiler (level 3 = maximum: goto-chain 30000 + exception bomb + InnerClasses cycle + constant-pool bomb) ===
antiDecompilerLevel = 3

# === Anti-debug (JDWP/JVMTI detection, timing checks, attach API detection) ===
antiDebug = true

# === VMP interpreter self-check (hash of own bytecode) ===
vmpSelfCheck = true

# === Custom digital watermark ===
watermark = kboxstudio

# === Jar integrity check / anti-repackaging ===
integrityCheck = true

# === Exception-jump obfuscation (IRETURN -> athrow + catch) ===
# DISABLED for self-obfuscation: the new+invokespecial+athrow pattern this pass
# generates causes VerifyError on a small number of the protector's own methods
# (the constructor-throw idiom conflicts with ASM COMPUTE_FRAMES on synthetic
# bridges). The transform is fully effective on third-party apps.
exceptionJumpObf = false

# === Native anti-hook (entry integrity + env scrub) ===
nativeAntiHook = true

# === Keep the CLI entry point + ASM library + KBox runtime classes intact ===
# Runtime classes must keep their original names so the protector can inject
# them into targets it protects.
keepPrefix = com.kbox.cli.ProtectorCli, org.objectweb.asm., com.kbox.runtime.
entryPoint = com.kbox.cli.ProtectorCli

# === C compiler path (for JNIC, if enabled) ===
cc = C:/msys64/mingw64/bin/gcc.exe
